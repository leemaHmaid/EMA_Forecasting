name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest            # fast suite; the full runs are `pytest -m slow` (~2 h)
