[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emaforecast"
version = "0.1.0"
description = "Rolling-origin forecasting benchmark of idiographic symptom networks on four EMA datasets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Pinned to the environment that produced Figure 2.
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "rdata==1.1.0"]   # rdata: optional check against the Fisher authors' R output

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: full-dataset runs, incl. the Geschwind mlVAR fits (up to ~2 h)"]
# LassoCV does not always converge on the smallest training windows (~10 pairs);
# the fit is still used, so this warning is expected.
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
